plugins { id 'com.android.application' }

android {
    namespace 'com.mixedapi.local'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig {
        applicationId 'com.mixedapi.local'
        minSdk 26
        targetSdk 33
        versionCode (1000 + Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1'))
        versionName (System.getenv('MIXED_API_VERSION') ?: new File(rootDir, '../VERSION').text.trim())
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}
