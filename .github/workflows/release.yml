name: Verify and release MIXED-API

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          echo "number=$version" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:ui
      - run: node scripts/test-google-session.mjs
      - run: npx playwright install --with-deps chromium
      - run: go build -o .ui-gateway ./cmd/mixed-api
      - run: npm run test:ui
        env:
          MIXED_TEST_BINARY: .ui-gateway
          MIXED_UI_OUTPUT: .ui-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence
          path: .ui-evidence/*.png
          include-hidden-files: true
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      MIXED_API_VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and build Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows vet failed' }
          New-Item -ItemType Directory -Path windows -Force | Out-Null
          ./scripts/prepare-webview2.ps1
          go build -tags bundled -trimpath -ldflags="-s -w -H=windowsgui -X github.com/NLKASHEI/MIXED-API/internal/gateway.BuildVersion=v$env:MIXED_API_VERSION" -o windows/MIXED-API.exe ./cmd/mixed-api
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          Copy-Item README.md,Install-MIXED-API.ps1,THIRD_PARTY_NOTICES.md -Destination windows/
          Copy-Item windows/MIXED-API.exe MIXED-API-Windows-x64.exe
          Compress-Archive -Path windows/* -DestinationPath MIXED-API-Windows-x64.zip
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Install-MIXED-API.ps1'),[ref]$null,[ref]$null)
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path -LiteralPath $nsis)) { choco install nsis -y --no-progress }
          & $nsis /V3 "/DPRODUCT_VERSION=$env:MIXED_API_VERSION" packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed' }
          if ((Get-Item MIXED-API-Windows-x64-Setup.exe).Length -lt 1000000) { throw 'Installer unexpectedly small' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: MIXED-API-Windows-x64*
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MIXED_API_VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore persistent signing key if configured
        shell: bash
        env:
          APK_DEBUG_KEYSTORE_B64: ${{ secrets.MIXED_API_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$APK_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$APK_DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          else
            echo '::warning::No persistent APK signing key; in-place upgrades are not guaranteed.'
          fi
      - name: Build, unit tests and lint
        run: gradle -p android --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk MIXED-API-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: MIXED-API-Android.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: android/app/build/reports/

  android-device:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-release
      - name: Start clean Android 15 emulator
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/mixed-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p android-device-evidence
          trap 'tail -n 80 android-device-evidence/emulator.log || true' ERR
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64' 'emulator' 'platform-tools'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name mixed-api --package 'system-images;android-35;google_apis;x86_64'
          test -s "$ANDROID_AVD_HOME/mixed-api.ini"
          "$ANDROID_HOME/emulator/emulator" -avd mixed-api -no-window -no-audio -no-snapshot -gpu swiftshader -memory 2048 -cores 2 > android-device-evidence/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
      - name: Verify installed APK and notification lifecycle
        run: python3 scripts/smoke-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-evidence
          path: android-device-evidence/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, verify, windows, android, android-device]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: dist
      - name: Publish successful build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/MIXED-API-Windows-x64-Setup.exe
          test -s dist/MIXED-API-Windows-x64.zip
          test -s dist/MIXED-API-Windows-x64.exe
          test -s dist/MIXED-API-Android.apk
          (cd dist && sha256sum MIXED-API-* > SHA256SUMS)
          cp Install-MIXED-API.ps1 dist/
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MIXED-API $GITHUB_REF_NAME" --notes-file "docs/release-notes-$GITHUB_REF_NAME.md"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url,assets:[.assets[].name]}'
