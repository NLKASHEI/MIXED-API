name: Build Windows and Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Test + Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Tests, race detector and go vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Build self-contained EXE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o windows/MIXED-API.exe ./cmd/mixed-api
          cp Start-MIXED-API.cmd Start-MIXED-API-LAN.cmd README.md windows/
          cp windows/MIXED-API.exe MIXED-API-Windows-x64.exe
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('MIXED-API-Windows-x64.zip','w',zipfile.ZIP_DEFLATED) as z:
              for file in Path('windows').iterdir():
                  z.write(file,file.name)
          PY
          sha256sum MIXED-API-Windows-x64.exe MIXED-API-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            MIXED-API-Windows-x64.zip
            MIXED-API-Windows-x64.exe
          if-no-files-found: error

  windows-native-tests:
    name: Windows native smoke tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Windows go tests and compilation
        shell: pwsh
        run: |
          go test ./...
          New-Item -ItemType Directory -Path windows -Force | Out-Null
          go build -trimpath -ldflags="-s -w" -o "windows/MIXED-API.exe" ./cmd/mixed-api
          if ($LASTEXITCODE -ne 0) { throw "Windows native Go build failed" }
      - name: Build NSIS one-click installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          }
          if (!(Test-Path $nsis)) { throw "makensis.exe unavailable" }
          & $nsis /V3 "packaging/windows/installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer compile failed" }
          if (!(Test-Path "MIXED-API-Windows-x64-Setup.exe")) { throw "Installer output missing" }
          if ((Get-Item "MIXED-API-Windows-x64-Setup.exe").Length -lt 1000000) { throw "Installer unexpectedly small" }
          Get-FileHash "MIXED-API-Windows-x64-Setup.exe" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: MIXED-API-Windows-x64-Setup.exe
          if-no-files-found: error

  android:
    name: Android APK (debug signed)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: |
          gradle -p android --no-daemon :app:assembleDebug --stacktrace
          cp android/app/build/outputs/apk/debug/app-debug.apk MIXED-API-Android.apk
          sha256sum MIXED-API-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: MIXED-API-Android.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, windows-native-tests, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/MIXED-API-Windows-x64.zip
          test -s dist/MIXED-API-Windows-x64.exe
          test -s dist/MIXED-API-Windows-x64-Setup.exe
          test -s dist/MIXED-API-Android.apk
          tag="v0.2.${GITHUB_RUN_NUMBER}"
          cat > notes.md <<'NOTES'
          MIXED-API 本地六上游 OpenAI 兼容网关，新增独立 Codex CLI、Windows 一键配置助手及 Android→PC 局域网桥接。

          - Windows 一键安装：`MIXED-API-Windows-x64-Setup.exe`，中文安装向导、开始菜单/桌面快捷方式、卸载入口。安装目录为用户 LocalAppData，无需管理员权限；卸载保留 mixed-api.json。
          - Windows 免安装：`MIXED-API-Windows-x64.zip`，解压后运行 `Start-MIXED-API.cmd`；分享给手机则改用 `Start-MIXED-API-LAN.cmd`。
          - Windows 单文件：`MIXED-API-Windows-x64.exe`，不需要安装，独立运行网关。
          - Android：下载 `MIXED-API-Android.apk`，安装并打开代理服务。
          - 默认 API Base URL：`http://127.0.0.1:8765/v1`；第一次启动会在本地生成随机 API Key 和 Admin Key。
          - 六个上游默认禁用；全新深蓝桌面 UI，分为概览、上游、模型、指引、设置；Android 使用轻量管理界面。
          - Windows 原生 Codex：无需安装 SillyTavern，可一键安装 Codex CLI、弹出账号授权，直接通过 app-server 对话。
          - Windows WorkBuddy：一键拉取并启动固定源码版本，自动识别已登录的 WorkBuddy 客户端。
          - Windows AIStudioToAPI：一键拉取/安装依赖，弹出 Google 首次登录流程，自动设置 localhost 与随机 API Key。
          - 网页账号授权必须由用户本人完成；绝不静默抓取 Cookie/密码/Token。
          - APK 是独立网关，不内置桌面 Codex / WorkBuddy / Camoufox；新版「电脑 MIXED-API」可以连接 PC 的 LAN 8766，只共享 API 而不共享管理界面，完整模型 ID 保持 codex/gpt-* 等不变。
          - 保姆级配置指南：https://github.com/NLKASHEI/MIXED-API/blob/main/docs/quickstart-zh.md
          - 请遵守上游许可证和服务条款。

          **注意：这是功能预览版软件（作为 GitHub 普通 Release 发布以方便下载），未做所有上游的真实账号端到端实测。Android 为 Debug 签名 APK，Windows 安装器和 EXE 未代码签名。安装器只打包 MIXED-API 网关，不捆绑第三方上游客户端。**
          NOTES
          gh release create "$tag" dist/MIXED-API-Windows-x64-Setup.exe dist/MIXED-API-Windows-x64.zip dist/MIXED-API-Windows-x64.exe dist/MIXED-API-Android.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MIXED-API $tag · Windows Setup / Portable / Android" --notes-file notes.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url,assets:[.assets[].name]}'
