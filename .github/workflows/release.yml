name: Verify and release MIXED-API

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
      android: ${{ steps.version.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
          android="$(jq -er '.android | select(. == "signed" or . == "preview" or . == "none")' packaging/release-targets.json)"
          echo "android=$android" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:ui
      - run: node scripts/test-google-session.mjs
      - run: node scripts/test-browser-extension.mjs
      - run: npx playwright install --with-deps chromium
      - run: go build -o .ui-gateway ./cmd/mixed-api
      - run: npm run test:ui
        env:
          MIXED_TEST_BINARY: .ui-gateway
          MIXED_UI_OUTPUT: .ui-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence
          path: .ui-evidence/*.png
          include-hidden-files: true
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      MIXED_API_VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and build Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows vet failed' }
          New-Item -ItemType Directory -Path windows -Force | Out-Null
          ./scripts/prepare-webview2.ps1
          go build -tags bundled -trimpath -ldflags="-s -w -H=windowsgui -X github.com/NLKASHEI/MIXED-API/internal/gateway.BuildVersion=v$env:MIXED_API_VERSION" -o windows/MIXED-API.exe ./cmd/mixed-api
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          Copy-Item README.md,Install-MIXED-API.ps1,THIRD_PARTY_NOTICES.md -Destination windows/
          Copy-Item windows/MIXED-API.exe MIXED-API-Windows-x64.exe
          Compress-Archive -Path windows/* -DestinationPath MIXED-API-Windows-x64.zip
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Install-MIXED-API.ps1'),[ref]$null,[ref]$null)
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path -LiteralPath $nsis)) { choco install nsis -y --no-progress }
          & $nsis /V3 "/DPRODUCT_VERSION=$env:MIXED_API_VERSION" packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed' }
          if ((Get-Item MIXED-API-Windows-x64-Setup.exe).Length -lt 1000000) { throw 'Installer unexpectedly small' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: MIXED-API-Windows-x64*
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MIXED_API_VERSION: ${{ needs.version.outputs.number }}
      MIXED_ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && needs.version.outputs.android == 'signed' && secrets.MIXED_API_ANDROID_KEY_PASSWORD || '' }}
      MIXED_ANDROID_SIGNER_SHA256: ${{ vars.MIXED_API_ANDROID_CERT_SHA256 }}
      ANDROID_RELEASE_MODE: ${{ needs.version.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android signing
        if: needs.version.outputs.android != 'none'
        shell: bash
        env:
          APK_KEYSTORE_B64: ${{ github.event_name != 'pull_request' && needs.version.outputs.android == 'signed' && secrets.MIXED_API_ANDROID_KEYSTORE_B64 || '' }}
        run: |
          set -euo pipefail
          umask 077
          export MIXED_ANDROID_KEYSTORE="$RUNNER_TEMP/mixed-release.p12"
          echo "MIXED_ANDROID_KEYSTORE=$MIXED_ANDROID_KEYSTORE" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$ANDROID_RELEASE_MODE" != signed ]]; then
            # Preview APKs never receive the persistent production signing key.
            export MIXED_ANDROID_KEY_PASSWORD="$(openssl rand -hex 32)"
            echo "::add-mask::$MIXED_ANDROID_KEY_PASSWORD"
            echo "MIXED_ANDROID_KEY_PASSWORD=$MIXED_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            keytool -genkeypair -keystore "$MIXED_ANDROID_KEYSTORE" -storetype PKCS12 -storepass:env MIXED_ANDROID_KEY_PASSWORD -alias mixed-api -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=MIXED-API preview build' >/dev/null
            expected="$(keytool -exportcert -keystore "$MIXED_ANDROID_KEYSTORE" -storepass:env MIXED_ANDROID_KEY_PASSWORD -alias mixed-api | openssl dgst -sha256 -r | cut -d' ' -f1)"
            echo "MIXED_ANDROID_SIGNER_SHA256=$expected" >> "$GITHUB_ENV"
          else
            test -n "$APK_KEYSTORE_B64" && test -n "$MIXED_ANDROID_KEY_PASSWORD" || { echo '::error::Persistent Android release signing credentials are required.'; exit 1; }
            printf '%s' "$APK_KEYSTORE_B64" | base64 -d > "$MIXED_ANDROID_KEYSTORE"
            [[ "$MIXED_ANDROID_SIGNER_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo '::error::Expected release certificate SHA-256 is required.'; exit 1; }
          fi
          chmod 600 "$MIXED_ANDROID_KEYSTORE"
          keytool -list -keystore "$MIXED_ANDROID_KEYSTORE" -storepass:env MIXED_ANDROID_KEY_PASSWORD -alias mixed-api >/dev/null
      - name: Build preceding version for update acceptance
        if: needs.version.outputs.android != 'none'
        run: |
          set -euo pipefail
          export MIXED_ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER - 1))
          gradle -p android --no-daemon :app:assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk MIXED-API-Android-update-baseline.apk
          python3 scripts/check-android-apk.py MIXED-API-Android-update-baseline.apk --signer-sha256 "$MIXED_ANDROID_SIGNER_SHA256" --version-code "$MIXED_ANDROID_VERSION_CODE" > android-update-baseline.json
      - name: Build, unit tests and lint
        run: |
          set -euo pipefail
          gradle -p android --no-daemon :app:assembleRelease :app:testDebugUnitTest :app:lintRelease --stacktrace
          if [[ "$ANDROID_RELEASE_MODE" == none ]]; then exit 0; fi
          cp android/app/build/outputs/apk/release/app-release.apk MIXED-API-Android.apk
          python3 scripts/check-android-apk.py MIXED-API-Android.apk --signer-sha256 "$MIXED_ANDROID_SIGNER_SHA256" --version-code "$((1000 + GITHUB_RUN_NUMBER))" > android-package.json
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.android != 'none'
        with:
          name: ${{ needs.version.outputs.android == 'signed' && 'android-release' || 'android-preview' }}
          path: MIXED-API-Android.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.android != 'none'
        with:
          name: android-update-test
          path: |
            MIXED-API-Android-update-baseline.apk
            android-update-baseline.json
            android-package.json
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: android/app/build/reports/

  android-device:
    if: needs.version.outputs.android != 'none'
    needs: [version, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.version.outputs.android == 'signed' && 'android-release' || 'android-preview' }}
      - uses: actions/download-artifact@v4
        with:
          name: android-update-test
      - name: Start clean Android 15 emulator
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/mixed-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p android-device-evidence
          trap 'tail -n 80 android-device-evidence/emulator.log || true' ERR
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64' 'emulator' 'platform-tools'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name mixed-api --package 'system-images;android-35;google_apis;x86_64'
          test -s "$ANDROID_AVD_HOME/mixed-api.ini"
          "$ANDROID_HOME/emulator/emulator" -avd mixed-api -no-window -no-audio -no-snapshot -gpu swiftshader -memory 2048 -cores 2 > android-device-evidence/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          # Root is confined to the disposable test emulator; release APK stays non-debuggable.
          adb root
          adb wait-for-device
          test "$(adb shell id -u | tr -d '\r')" = 0
          adb shell input keyevent 82
      - name: Verify installed APK and notification lifecycle
        env:
          MIXED_ANDROID_DISPOSABLE_EMULATOR: '1'
        run: python3 scripts/smoke-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-evidence
          path: android-device-evidence/
          if-no-files-found: error

  release:
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.version.result == 'success' && needs.verify.result == 'success' &&
      needs.windows.result == 'success' && needs.android.result == 'success' &&
      (needs.android-device.result == 'success' ||
       (needs.version.outputs.android == 'none' && needs.android-device.result == 'skipped'))
    needs: [version, verify, windows, android, android-device]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: dist
      - name: Publish successful build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RELEASE_MODE: ${{ needs.version.outputs.android }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/MIXED-API-Windows-x64-Setup.exe
          test -s dist/MIXED-API-Windows-x64.zip
          test -s dist/MIXED-API-Windows-x64.exe
          if [[ "$ANDROID_RELEASE_MODE" == signed ]]; then
            test -s dist/MIXED-API-Android.apk
          else
            test ! -e dist/MIXED-API-Android.apk
          fi
          cp Install-MIXED-API.ps1 dist/
          (cd dist && sha256sum MIXED-API-* Install-MIXED-API.ps1 > SHA256SUMS)
          cp "docs/release-notes-$GITHUB_REF_NAME.md" "$RUNNER_TEMP/release-notes.md"
          printf '\n构建提交：`%s`。构建与验收：[Actions %s](%s/%s/actions/runs/%s)。\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MIXED-API $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url,assets:[.assets[].name]}'
      - name: Download separately labelled Android preview
        if: needs.version.outputs.android == 'preview'
        uses: actions/download-artifact@v4
        with:
          name: android-preview
          path: android-preview
      - name: Add Android preview after desktop publication
        if: needs.version.outputs.android == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mv android-preview/MIXED-API-Android.apk dist/MIXED-API-Android-preview.apk
          (cd dist && sha256sum MIXED-API-* Install-MIXED-API.ps1 > SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" dist/MIXED-API-Android-preview.apk dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url,assets:[.assets[].name]}'
